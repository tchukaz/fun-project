<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Tracker – QA Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Task Tracker</h1>
      <p class="subtitle">Simple mobile-friendly app for QA testing practice.</p>
    </header>

    <section class="card">
      <form id="task-form" class="task-form">
        <label for="task-input" class="sr-only">New task</label>
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task..."
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit">Add</button>
      </form>

      <div class="toolbar">
        <span id="task-counter">0 tasks</span>
        <select id="filter-select">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <button id="clear-completed" class="secondary-btn">
        Clear completed
      </button>
    </section>

    <footer class="footer">
      <p>Built by Chukwuka Okoro • QA practice project</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
